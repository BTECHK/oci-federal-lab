name: ZAP Baseline Security Scan

on:
  pull_request:
    branches: [master]
  schedule:
    # Mondays at 04:00 UTC — quiet window for scheduled DAST sweeps.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fedtracker-app dependencies
        working-directory: fedtracker-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate gRPC stubs (Python only)
        run: |
          mkdir -p fedtracker-app/proto
          python -m grpc_tools.protoc \
            --proto_path=fedagent/proto \
            --python_out=fedtracker-app/proto \
            --grpc_python_out=fedtracker-app/proto \
            fedagent/proto/compliance.proto
          touch fedtracker-app/proto/__init__.py

      - name: Start fedtracker-app
        working-directory: fedtracker-app
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: /tmp/zap-fedtracker.db
        run: |
          # NOTE: answers/ is gitignored. CI either provides answers via a
          # secret tarball or skips this scan in fork PRs. The scaffold itself
          # has no working endpoints for ZAP to walk, so this step requires
          # answers/.
          if [ ! -f answers/main.py ]; then
            echo "answers/ not present in this CI context — skipping scan"
            echo "ZAP_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          uvicorn answers.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -fsS http://localhost:8000/health

      - name: Run ZAP Baseline Scan
        if: env.ZAP_SKIP != '1'
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: true

      - name: Upload ZAP report
        if: always() && env.ZAP_SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
