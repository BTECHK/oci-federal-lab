syntax = "proto3";

package fedplatform.compliance.v1;

option go_package = "fedplatform/fedagent/pb";

import "google/protobuf/empty.proto";

// ComplianceService is the internal gRPC contract between fedtracker-app
// (intake / Python FastAPI) and fedagent (Go compliance scanner).
//
// External traffic enters via REST on the FedTracker API. Internal
// compliance lookups go over gRPC for type safety, schema evolution, and
// lower per-call overhead. See adrs/ADR-014-grpc-internal-rest-external.md.
service ComplianceService {
  // P1 method — returns the latest OpenSCAP score for a host.
  rpc GetOscapScore(GetOscapScoreRequest) returns (GetOscapScoreResponse);

  // P2 methods — DR drill telemetry.
  rpc GetK3sNodeHealth(google.protobuf.Empty) returns (K3sNodeHealthResponse);
  rpc GetADBBackupStatus(google.protobuf.Empty) returns (ADBBackupStatusResponse);

  // P3 methods — supply chain + streaming.
  rpc GetSupplyChainStatus(ImageReference) returns (SupplyChainStatusResponse);
  rpc StreamComplianceEvents(google.protobuf.Empty) returns (stream ComplianceEvent);
}

message GetOscapScoreRequest {
  string host = 1;
  string framework = 2;   // "fedramp" | "nist" | "cmmc"
}

message GetOscapScoreResponse {
  int32 score = 1;
  int32 findings_high = 2;
  int32 findings_medium = 3;
  int32 findings_low = 4;
  string scanned_at = 5;  // ISO 8601 UTC
}

message K3sNodeHealthResponse {
  message NodeStatus {
    string node = 1;
    bool ready = 2;
    string last_heartbeat = 3;  // ISO 8601 UTC
  }
  repeated NodeStatus nodes = 1;
}

message ADBBackupStatusResponse {
  string last_backup_at = 1;       // ISO 8601 UTC; empty when unknown
  int64 backup_age_seconds = 2;    // -1 when last_backup_at is unknown
  bool within_rpo = 3;             // age < 4h (RPO threshold)
}

message ImageReference {
  string registry = 1;     // "iad.ocir.io"
  string repository = 2;   // "fedplatform/fedtracker"
  string tag = 3;          // "v1.0.0"
}

message SupplyChainStatusResponse {
  bool cosign_signature_valid = 1;
  int32 trivy_findings_high = 2;
  int32 trivy_findings_medium = 3;
  int32 trivy_findings_low = 4;
  repeated string sbom_components = 5;
  string scanned_at = 6;
}

message ComplianceEvent {
  string event_type = 1;       // "scan_complete" | "drift_detected" | "remediation"
  string resource_id = 2;
  string severity = 3;          // "info" | "warning" | "critical"
  string details = 4;
  string occurred_at = 5;       // ISO 8601 UTC
}
